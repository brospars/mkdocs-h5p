[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-h5p"
version = "0.2.0"
description = "MkDocs plugin for embedding H5P files in Markdown using h5p-standalone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Benoit Rospars" }
]
dependencies = [
  "mkdocs>=1.5"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: MkDocs",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation"
]

[project.urls]
Homepage = "https://github.com/brospars/mkdocs-h5p"
Repository = "https://github.com/brospars/mkdocs-h5p"

[project.entry-points."mkdocs.plugins"]
h5p = "mkdocs_h5p.plugin:H5PPlugin"

[project.optional-dependencies]
test = [
  "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
